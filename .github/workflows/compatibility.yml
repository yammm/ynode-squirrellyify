name: latest-peer-compatibility

on:
    schedule:
        - cron: "30 9 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    typecheck:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24.0.0"
                  cache: npm

            - name: Install reviewed dependencies
              run: npm ci

            - name: Check current peer ranges against latest matching releases
              run: npm run typecheck:latest
